<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Meu primeiro site</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333333; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="background-color: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); box-sizing: border-box; border-top: 6px solid #005792;">
        
        <h1 style="margin: 0 0 10px 0; font-size: 26px; color: #005792; text-align: center;">Mateus Welter</h1>
        <p style="margin: 0 0 25px 0; font-size: 14px; color: #666666; text-align: center; font-style: italic;">Perfil Estudantil</p>
        
        <div style="margin-bottom: 15px; padding: 12px; background-color: #f8f9fa; border-left: 4px solid #005792; border-radius: 4px;">
            <strong style="color: #005792; font-size: 14px; text-transform: uppercase; display: block; margin-bottom: 2px;">Idade</strong>
            <span style="font-size: 16px;">16 anos</span>
        </div>

        <div style="margin-bottom: 15px; padding: 12px; background-color: #f8f9fa; border-left: 4px solid #005792; border-radius: 4px;">
            <strong style="color: #005792; font-size: 14px; text-transform: uppercase; display: block; margin-bottom: 2px;">Localização</strong>
            <span style="font-size: 16px;">Schroeder - SC</span>
        </div>

        <div style="margin-bottom: 15px; padding: 12px; background-color: #f8f9fa; border-left: 4px solid #005792; border-radius: 4px;">
            <strong style="color: #005792; font-size: 14px; text-transform: uppercase; display: block; margin-bottom: 2px;">Instituição</strong>
            <span style="font-size: 16px;">Centro WEG</span>
        </div>

        <div style="margin-bottom: 0; padding: 12px; background-color: #f8f9fa; border-left: 4px solid #005792; border-radius: 4px;">
            <strong style="color: #005792; font-size: 14px; text-transform: uppercase; display: block; margin-bottom: 2px;">Curso Técnico</strong>
            <span style="font-size: 16px;">Cibersistemas para Automação</span>
        </div>

    </div>
</body>
</html>
